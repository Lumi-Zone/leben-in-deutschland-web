name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install video encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore generated Instagram growth assets
        uses: actions/cache@v4
        with:
          path: public/instagram/growth-v1
          key: instagram-growth-v1-${{ hashFiles('scripts/social/instagram-growth-core.mjs', 'scripts/social/generate-instagram-growth.mjs', 'src/data/questions.json') }}

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        env:
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
          PUBLIC_UMAMI_DOMAINS: ${{ vars.PUBLIC_UMAMI_DOMAINS }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_APPLE_PROVIDER_TOKEN: ${{ vars.PUBLIC_APPLE_PROVIDER_TOKEN }}
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 20 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

      # Compare the new build with the live site before it is replaced. Never blocks the deploy.
      - name: Find pages changed since the last deploy
        continue-on-error: true
        run: node scripts/indexnow.mjs diff --urls indexnow-urls.json

      - name: Keep changed URLs for IndexNow
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Runs after the deploy so the key file and new content are live when Bing checks them.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download changed URLs
        id: urls
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Submit changed URLs to IndexNow
        if: steps.urls.outcome == 'success'
        run: node scripts/indexnow.mjs submit --urls indexnow-urls.json
